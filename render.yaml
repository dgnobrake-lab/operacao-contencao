# Publicação no Render: um serviço web Node entrega o jogo E a partida no mesmo endereço.
# O HTML do jogo tem mais de 100 MB e NÃO vai no repositório (o GitHub recusa acima de 100 MB).
# Ele fica em jogo/ dividido em partes de 64 MB; o build junta tudo em publico/index.html (juntar_jogo.js).
services:
  - type: web
    name: operacao-contencao
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run montar-jogo
    startCommand: npm start
    healthCheckPath: /saude
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MAX_JOGADORES
        value: "2"       # sala de 2, igual ao multiplayer do PC (v84)
